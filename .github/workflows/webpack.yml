name: MTAI CI

on:
  push:
    branches: ["main", "phase6-analysis"]
  pull_request:
    branches: ["main", "phase6-analysis"]
  workflow_dispatch:

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npx vitest run
      - name: Type-check source
        run: npx tsc --noEmit
